<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venom Ware Admin</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="shell admin-shell">
    <section id="login-panel" class="panel login-panel">
      <div class="brand">
        <div class="mark">VW</div>
        <div>
          <h1>Admin Login</h1>
          <p>Enter the panel password to manage script access.</p>
        </div>
      </div>

      <form id="login-form" class="login-form">
        <input id="admin-key" placeholder="Password" type="password" autocomplete="current-password">
        <button id="login-button" type="submit">Login</button>
      </form>

      <p id="login-state" class="status-text">4 failed attempts per IP are allowed each hour.</p>
    </section>

    <section id="admin-panel" class="panel admin-panel is-hidden">
      <div class="brand">
        <div class="mark">VW</div>
        <div>
          <h1>Admin</h1>
          <p>Approve IPs, generate keys, and upload the served Lua body.</p>
        </div>
      </div>

      <div class="toolbar">
        <button id="refresh-state" type="button">Refresh</button>
        <button id="logout-button" type="button">Logout</button>
      </div>

      <div class="admin-grid">
        <section>
          <h2>Requests</h2>
          <div id="attempts" class="list"></div>
        </section>

        <section>
          <h2>Approved Users</h2>
          <div id="approved-users" class="list"></div>
        </section>
      </div>

      <section>
        <div class="section-head">
          <h2>All Keys</h2>
          <label class="checkline">
            <input id="revoke-all-confirm" type="checkbox">
            Confirm revoke all
          </label>
          <button id="revoke-all" type="button" disabled>Revoke All</button>
        </div>
        <div class="admin-grid single-grid">
          <div id="keys" class="list"></div>
        </div>
      </section>

      <section>
        <div class="section-head">
          <h2>Script Body</h2>
          <button id="load-script" type="button">Load Stored Script</button>
        </div>
        <p id="script-state">Not loaded.</p>
        <textarea id="script-body" spellcheck="false" placeholder="Paste obfuscated Lua here."></textarea>
        <div class="copy-row">
          <input id="generated-key" readonly placeholder="Generated key appears here">
          <button id="save-script" type="button">Save Script</button>
        </div>
      </section>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
