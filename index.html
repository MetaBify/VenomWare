<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venom Ware Code Host</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="shell">
    <section class="panel home-panel">
      <div class="brand">
        <div class="mark"><img src="/assets/logo.png" alt="Venom Ware logo"></div>
        <div>
          <h1>Venom Ware</h1>
        </div>
      </div>

      <section class="tutorial">
        <h2>How to use</h2>
        <ol>
          <li>Click Generate Key With Discord and authorize your Discord account.</li>
          <li>If you have the required role, your key and loaders will appear.</li>
          <li>Paste the key below only if you want to rebuild the loaders later.</li>
        </ol>

        <a class="button-link discord-link" href="/api/discord-login">Generate Key With Discord</a>

        <div class="copy-row">
          <input id="user-key" placeholder="Paste generated key here">
          <button id="copy-regular-loader" type="button">Copy Regular Loader</button>
        </div>

        <button id="copy-test-loader" type="button">Copy Test Loader</button>

        <div class="loader-grid">
          <label>
            <span>Regular loader</span>
            <textarea id="regular-loader-preview" readonly spellcheck="false"></textarea>
          </label>
          <label>
            <span>Test loader</span>
            <textarea id="test-loader-preview" readonly spellcheck="false"></textarea>
          </label>
        </div>
      </section>
    </section>
  </main>

  <script src="/site.js"></script>
</body>
</html>
