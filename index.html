<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venom Ware Code Host</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="apple-touch-icon" href="/assets/logo.png">
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <main class="shell">
    <section class="panel home-panel">
      <div class="brand">
        <div class="mark"><img src="/assets/logo.png" alt="Venom Ware logo"></div>
        <div>
          <h1>Venom Ware</h1>
        </div>
      </div>

      <div class="copy-row">
        <input id="raw-url" value="/api/script" readonly>
        <button id="copy-url" type="button">Copy First Loader</button>
      </div>

      <section class="tutorial">
        <h2>How to use</h2>
        <ol>
          <li>Run the first loader in your executor. It registers your IP and shows pending access.</li>
          <li>Wait until your IP is approved and you receive a generated key.</li>
          <li>Paste the key below, copy the keyed loader, then run it in your executor.</li>
        </ol>

        <div class="copy-row">
          <input id="user-key" placeholder="Paste generated key here">
          <button id="copy-keyed-loader" type="button">Copy Keyed Loader</button>
        </div>

        <textarea id="loader-preview" readonly spellcheck="false"></textarea>
        <a class="button-link discord-link" href="/api/discord-login">Generate Key With Discord</a>
      </section>
    </section>
  </main>

  <script src="/site.js"></script>
</body>
</html>
